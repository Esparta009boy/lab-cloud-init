#cloud-config
package_update: true

packages:
  - docker.io
  - git

users:
  - name: aluno
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    groups: [sudo, docker]

write_files:
  - path: /home/aluno/bem-vindo.txt
    content: |
      ========================================
      Bem-vindo ao ambiente do aluno!
      Laboratorio de Cloud-init e Observabilidade.
      ========================================
    permissions: '0644'

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - chown -R aluno:aluno /home/aluno
  - docker run -d -p 3000:3000 --name grafana-server grafana/grafana:latest